aid: meadow
name: Meadow
description: >-
  Meadow is a financial technology company delivering modern student financial
  services to colleges and universities. Its platform spans the full student
  financial lifecycle — Meadow Price (a mobile, SAI-compliant net price
  calculator), Meadow Pay (student billing and payments with automated
  workflows), Meadow Pre (pre-collections for recovering unpaid tuition), and
  Meadow Checkout (campus-wide collection of non-tuition fees). Meadow helps
  institutions improve enrollment, retention, and payment outcomes from
  application through graduation. Backed by Matrix Partners and Y Combinator. No
  public API or developer platform is published as of this profile.
